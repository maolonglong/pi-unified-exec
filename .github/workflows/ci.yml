name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # A hung process or PTY test would otherwise hold a runner for the 6 hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Native optional packages do not exist in npm until the first release.
      - run: npm install --ignore-scripts
      - run: cargo build -p persistent-exec-ffi --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked
        env:
          CARGO_BUILD_WARNINGS: deny
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: npx oxfmt --check packages
        if: matrix.os == 'ubuntu-latest'
      - run: cargo doc --workspace --no-deps --locked
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
