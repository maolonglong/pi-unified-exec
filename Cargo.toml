[workspace]
members = [
    "crates/persistent-exec-core",
    "crates/persistent-exec-ffi",
    "crates/persistent-exec-pty",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
version = "0.1.7"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
portable-pty = "0.9.0"
pretty_assertions = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The cdylib ships inside the npm native packages, so size matters. Panics must stay
# `unwind`: the FFI layer catches them with `catch_unwind` instead of aborting the host.
[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
